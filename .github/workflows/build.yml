name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: cmake -S tests -B build-host -G Ninja
      - name: Build
        run: cmake --build build-host
      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Checkout Pico SDK 2.2.0
        run: git clone --branch 2.2.0 --depth 1 --recurse-submodules https://github.com/raspberrypi/pico-sdk.git pico-sdk
      - name: Configure public firmware
        run: >-
          cmake -S . -B build -G Ninja
          -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk
      - name: Build firmware
        run: cmake --build build --target pico_spc_player
      - uses: actions/upload-artifact@v4
        with:
          name: Pico-SPC-Player-${{ github.sha }}
          path: build/Pico-SPC-Player.uf2
          if-no-files-found: error
